[project]
name = "pridge"
version = "1.0.0"
description = "FTC pRidge rating engine: per-event ridge regression regularized toward pre-event EPA."
requires-python = ">=3.12"
dependencies = [
    "warehouse",
    "numpy>=2.1",
    "typer>=0.15",
    "structlog>=24.4",
]

[project.scripts]
pridge = "pridge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pridge"]
