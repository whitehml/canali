[project]
name = "analysis"
version = "1.0.0"
description = "FTC model comparison."
requires-python = ">=3.12"
dependencies = [
    "warehouse",
    "epa",
    "pridge",
    "numpy>=2.1",
    "typer>=0.15",
    "structlog>=24.4",
]

[project.scripts]
analysis = "analysis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]
