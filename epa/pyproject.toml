[project]
name = "epa"
version = "1.0.0"
description = "FTC EPA rating engine: event-sequential expected points added, fit per season from the rule pack."
requires-python = ">=3.12"
dependencies = [
    "warehouse",
    "numpy>=2.1",
    "scipy>=1.18",
    "typer>=0.15",
    "structlog>=24.4",
]

[project.scripts]
epa = "epa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epa"]
