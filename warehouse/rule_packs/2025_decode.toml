# DECODE (2025-26) rule pack, starting-year convention.
#
# Components are generated from a saved copy of the OpenAPI document:
#
#     warehouse rules generate --season 2025 --openapi swagger.json

season = 2025
game = "DECODE"
version = "1"

[ranking]
rp_win = 3
rp_tie = 1
rp_loss = 0
has_bonus_rp = true
# Competition Manual, Table 13-1 (V10), section 13.6.3.
formula = "rank_score"
tiebreakers = [
    "avg:preFoulTotal",
    "avg:teleopBasePoints",
    "avg:autoPoints",
    "random",
]

[structure]
alliance_size = 2
playoff_structure = "double_elimination_scaled"
playoff_implemented = true
advancement_implemented = true

[[structure.alliance_brackets]]
min_teams = 4
max_teams = 10
alliances = 2

[[structure.alliance_brackets]]
min_teams = 11
