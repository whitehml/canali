# INTO THE DEEP (2024-25) rule pack, starting-year convention.
#
# Components are generated from a saved copy of the OpenAPI document:
#
#     warehouse rules generate --season 2024 --openapi swagger.json

season = 2024
game = "INTO THE DEEP"
version = "1"

[ranking]
rp_win = 2
rp_tie = 1
rp_loss = 0
has_bonus_rp = false
# Competition Manual, Table 13-1 (V4), section 13.5.3.
formula = "rank_score"
tiebreakers = [
    "avg:autoPoints",
    "avg:teleopAscentPoints",
    "max:totalPoints",
    "random",
]

[structure]
alliance_size = 2
playoff_structure = "double_elimination_scaled"
playoff_implemented = true
advancement_implemented = false

[[structure.alliance_brackets]]
min_teams = 4
max_teams = 10
alliances = 2

[[structure.alliance_brackets]]
