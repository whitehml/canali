# CENTERSTAGE (2023-24) rule pack, starting-year convention.
#
# Components are generated from a saved copy of the OpenAPI document:
#
#     warehouse rules generate --season 2023 --openapi swagger.json

season = 2023
game = "CENTERSTAGE"
version = "1"

[ranking]
rp_win = 2
rp_tie = 1
rp_loss = 0
has_bonus_rp = false
# Game Manual Part 1 - Traditional Events, section 5.1.1 (rev 1.4, 2024-01-10)
formula = "rank_score"
tiebreakers = ["avg:autoPoints", "avg:endgamePoints", "max:totalPoints", "random"]

[structure]
