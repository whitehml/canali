# POWERPLAY (2022-23) rule pack, starting-year convention.
#
# Components are generated from a saved copy of the OpenAPI document:
#
#     warehouse rules generate --season 2022 --openapi swagger.json

season = 2022
game = "POWERPLAY"
version = "1"

[ranking]
rp_win = 2
rp_tie = 1
rp_loss = 0
has_bonus_rp = false
# Game Manual Part 1, section 5.1.1 (rev 1.2, 2022-10-18)
formula = "rank_score"
tiebreakers = ["avg:autoPoints", "avg:endgamePoints", "max:totalPoints", "random"]

[structure]
alliance_size = 2
playoff_implemented = false
advancement_implemented = false


