# BIOBUZZ (2026-27) rule pack.
#
# Components are generated from a saved copy of the OpenAPI document:
#
#     warehouse rules generate 2026 --openapi swagger.json

season = 2026
game = "BIOBUZZ"
version = "1"

[ranking]
rp_win = 3
rp_tie = 1
rp_loss = 0
has_bonus_rp = true
formula = "rank_score"

# Competition Manual, Table 13-1 (V1), section 13.6.3.
tiebreakers = [
    "avg:preFoulTotal",
    "avg:hiveTips",
    "avg:autoPoints",
    "random",
]

# RCMP and CMP are guesses until FIRST publishes
[[ranking.bonus_rp]]
component = "swarmRP"
sum_of = ["autoLeavePoints", "autoParkPoints", "teleopParkPoints"]
thresholds = { REG = 16, RCMP = 21, CMP = 21 }

[[ranking.bonus_rp]]
component = "pollinator1RP"
sum_of = ["hiveTips"]
thresholds = { REG = 4, RCMP = 5, CMP = 7 }

[[ranking.bonus_rp]]
component = "pollinator2RP"
sum_of = ["hiveTips"]
thresholds = { REG = 7, RCMP = 8, CMP = 13 }

[structure]
alliance_size = 2
playoff_structure = "double_elimination_scaled"
playoff_implemented = true
advancement_implemented = true

[[structure.alliance_brackets]]
min_teams = 4
max_teams = 10
alliances = 2

[[structure.alliance_brackets]]
min_teams = 11
max_teams = 20
alliances = 4

[[structure.alliance_brackets]]
min_teams = 21
max_teams = 40
alliances = 6

[[structure.alliance_brackets]]
min_teams = 41
max_teams = 64
alliances = 8


